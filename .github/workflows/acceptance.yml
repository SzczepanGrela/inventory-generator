name: Inventory operational acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Reviewed exercise during a coordinated VPS window
        required: true
        type: choice
        options: [canary, rollback]
      digest:
        description: Attested candidate digest (canary uses its healthy stable image)
        required: true
        type: string
      revision:
        description: Full revision in that image
        required: true
        type: string
      previous_digest:
        description: Rollback only - exact current production digest
        required: false
        type: string
      previous_revision:
        description: Rollback only - exact current production revision
        required: false
        type: string
      canary_uuid:
        description: Canary only - reviewed disposable app with no domain or storage
        required: false
        type: string
      confirmation:
        description: Copy the exact confirmation from docs/operational-acceptance.md
        required: true
        type: string

permissions: {}

# Same lock as deploy.yml: never compete with a release or manual rollback.
concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/szczepangrela/inventory-generator

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate scope and verify both image identities
        env:
          MODE: ${{ inputs.mode }}
          DIGEST: ${{ inputs.digest }}
          REVISION: ${{ inputs.revision }}
          PREVIOUS_DIGEST: ${{ inputs.previous_digest }}
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          CANARY_UUID: ${{ inputs.canary_uuid }}
          PRODUCTION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -m infra.acceptance_preflight

  exercise:
    needs: preflight
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-vps
      - name: Run the reviewed exercise
        env:
          MODE: ${{ inputs.mode }}
          DIGEST: ${{ inputs.digest }}
          REVISION: ${{ inputs.revision }}
          PREVIOUS_DIGEST: ${{ inputs.previous_digest }}
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          CANARY_UUID: ${{ inputs.canary_uuid }}
          CONFIRMATION: ${{ inputs.confirmation }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [[ "$MODE" == canary ]]; then
            python3 -m infra.canary_acceptance \
              --coolify-url "$COOLIFY_URL" \
              --application-uuid "$CANARY_UUID" \
              --production-application-uuid "$COOLIFY_APPLICATION_UUID" \
              --stable-digest "$DIGEST" --stable-revision "$REVISION" \
              --confirmation "$CONFIRMATION"
          elif [[ "$MODE" == rollback ]]; then
            python3 -m infra.rollback_acceptance \
              --coolify-url "$COOLIFY_URL" \
              --application-uuid "$COOLIFY_APPLICATION_UUID" \
              --public-url "$PRODUCTION_URL" \
              --digest "$DIGEST" --expected-revision "$REVISION" \
              --previous-digest "$PREVIOUS_DIGEST" \
              --previous-revision "$PREVIOUS_REVISION" \
              --confirmation "$CONFIRMATION"
          else
            exit 64
          fi
