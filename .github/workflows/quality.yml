name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  IMAGE_NAME: ghcr.io/szczepangrela/inventory-generator

jobs:
  test:
    name: Test and build (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore inventory-generator.sln
      - run: dotnet build inventory-generator.sln --no-restore --configuration Release
      - run: dotnet test inventory-generator.sln --no-build --configuration Release

  container:
    name: Container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the tested image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: RELEASE_REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          load: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
          provenance: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('{0}@{1}', env.IMAGE_NAME, steps.build.outputs.digest) || format('{0}:{1}', env.IMAGE_NAME, github.sha) }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Attest the published image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  quality-gate:
    name: Quality gate
    if: always()
    needs: [test, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality job
        env:
          TEST_RESULT: ${{ needs.test.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$CONTAINER_RESULT" = success
