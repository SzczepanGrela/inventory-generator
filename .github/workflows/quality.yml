name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/szczepangrela/inventory-generator

jobs:
  test:
    name: Test and build (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore inventory-generator.sln
      - run: dotnet build inventory-generator.sln --no-restore --configuration Release
      - run: dotnet test inventory-generator.sln --no-build --configuration Release
      - name: Test release automation (Python)
        run: python3 -m unittest discover -s tests -v

  container:
    name: Container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the tested image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          build-args: RELEASE_REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          load: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
          provenance: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Select the exact tested image
        id: tested-image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            echo "ref=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke-test the exact image
        env:
          IMAGE_REF: ${{ steps.tested-image.outputs.ref }}
        run: |
          container_name="inventory-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --cap-drop ALL \
            --init \
            --cpus 1 \
            --memory 512m \
            --memory-reservation 128m \
            --memory-swap 512m \
            "$IMAGE_REF" >/dev/null

          health=starting
          for _ in {1..60}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_name")"
            if [[ "$health" == healthy ]]; then
              break
            fi
            if [[ "$health" == unhealthy ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$health" != healthy ]]; then
            docker logs "$container_name"
            echo "Container health status is $health." >&2
            exit 1
          fi

          # 1. Verify health and revision
          docker exec "$container_name" \
            curl --fail --silent --show-error "http://127.0.0.1:8080/api/health"

          # 2. Verify container runs as non-root
          user_id="$(docker exec "$container_name" id -u)"
          if [[ "$user_id" == "0" ]]; then
            echo "Container must run as non-root user (got UID $user_id)" >&2
            exit 1
          fi

          # 3. Verify security headers
          docker exec "$container_name" \
            curl --fail --silent -I "http://127.0.0.1:8080/" | grep -i "content-security-policy"

          # 4. Smoke-test small exports for all 3 formats
          smoke_payload='{"attributes":[{"name":"Item","type":"String"}],"products":[{"id":1,"attributes":{"Item":"SmokeTest"}}]}'
          for format in csv html docx; do
            docker exec "$container_name" \
              curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              -d "$smoke_payload" \
              "http://127.0.0.1:8080/api/export/$format" >/dev/null
          done
      - name: Scan fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tested-image.outputs.ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Attest the published image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  quality-gate:
    name: Quality gate
    if: always()
    needs: [test, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality job
        env:
          TEST_RESULT: ${{ needs.test.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$CONTAINER_RESULT" = success

  deploy:
    name: Deploy tested digest
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [container, quality-gate]
    permissions:
      attestations: read
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      digest: ${{ needs.container.outputs.digest }}
      expected_revision: ${{ github.sha }}
